 max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g transform="translate(0, 0)" class="label"><foreignObject height="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g transform="translate(766.8593826293945, 59)" id="flowchart-Q-0" class="node default"><rect height="102" width="326.6458435058594" y="-51" x="-163.3229217529297" style="" class="basic label-container"></rect><g transform="translate(-133.3229217529297, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="266.6458435058594"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>入口：我们提出的问题<br/>为谁研究 · 要完成什么 · 希望得到什么<br/>无方向时先浏览入口，形成具体问题</p></span></div></foreignObject></g></g><g transform="translate(766.8593826293945, 209)" id="flowchart-S-1" class="node default"><rect height="102" width="380" y="-51" x="-190" style="" class="basic label-container"></rect><g transform="translate(-160, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="320"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>来源：10 个网站入口 + 相关原始资料<br/>社区经历｜软件评价｜付费任务｜仓库与产品<br/>自动研究按问题选择可读取的公开来源</p></span></div></foreignObject></g></g><g transform="translate(766.8593826293945, 359)" id="flowchart-E-2" class="node default"><rect height="102" width="350.9375" y="-51" x="-175.46875" style="" class="basic label-container"></rect><g transform="translate(-145.46875, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="290.9375"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>执行：网页 → 本地服务 → Codex<br/>实际搜索 → 尝试读取原文 → 分析和筛选<br/>展示过程、停止任务、查看运行历史</p></span></div></foreignObject></g></g><g transform="translate(766.8593826293945, 509)" id="flowchart-G-3" class="node default"><rect height="102" width="348" y="-51" x="-174" style="" class="basic label-container"></rect><g transform="translate(-144, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="288"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>依据：模型判断 + 程序检查<br/>关联主链接和打开记录，尝试核对短引文<br/>标注来源角色与读取状态，保留排除理由</p></span></div></foreignObject></g></g><g transform="translate(571.9921875, 707)" id="flowchart-R-4" class="node default"><rect height="102" width="348.6145935058594" y="-51" x="-174.3072967529297" style="" class="basic label-container"></rect><g transform="translate(-144.3072967529297, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="288.6145935058594"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>结果：需求线索 / GitHub 项目 / AI 产品<br/>问题与作用 · 对我的价值 · 来源依据<br/>已有替代 · 未知项 · 下一步</p></span></div></foreignObject></g></g><g transform="translate(392, 929)" id="flowchart-L-5" class="node default"><rect height="102" width="307.96875" y="-51" x="-153.984375" style="" class="basic label-container"></rect><g transform="translate(-123.984375, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="247.96875"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>保存：发现库 + 采集计划<br/>链接、摘录、理解、下一步与进展<br/>编辑筛选 · 去重 · 回收站 · 导入导出</p></span></div></foreignObject></g></g><g transform="translate(182, 1139)" id="flowchart-H-6" class="node default"><rect height="102" width="348" y="-51" x="-174" style="" class="basic label-container"></rect><g transform="translate(-144, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="288"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>继续研究：由人推进<br/>补采、试用、访谈与小实验<br/>决定采用、做原型或暂缓，再提出新问题</p></span></div></foreignObject></g></g><g transform="translate(751.984375, 929)" id="flowchart-F-14" class="node default"><rect height="150" width="316" y="-75" x="-158" style="" class="basic label-container"></rect><g transform="translate(-128, -60)" style="" class="label"><rect></rect><foreignObject height="120" width="256"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>适合什么方向<br/>发现跨行业重复任务与手工补救<br/>寻找开源项目、AI 工具与替代方案<br/>理解陌生工作流与工具使用障碍<br/>支持产品选题、竞品初查与学习研究</p></span></div></foreignObject></g></g><g transform="translate(602, 1139)" id="flowchart-P-17" class="node default"><rect height="174" width="396" y="-87" x="-198" style="" class="basic label-container"></rect><g transform="translate(-168, -72)" style="" class="label"><rect></rect><foreignObject height="144" width="336"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>可扩展成什么产品 · 构想<br/>个人研究助手｜GitHub 评估台｜AI 工具选型台<br/>需求雷达｜垂直情报订阅｜团队研究库<br/>反馈管理｜证据关联 PRD｜简报或研究接口<br/>需补：主题归并、历史检索、试跑评估<br/>定时增量、同步权限、任务流与成本管理</p></span></div></foreignObject></g></g><g transform="translate(961.7265777587891, 707)" id="flowchart-B-20" class="node default"><rect height="198" width="334.85418701171875" y="-99" x="-167.42709350585938" style="" class="basic label-container"></rect><g transform="translate(-137.42709350585938, -84)" style="" class="label"><rect></rect><foreignObject height="168" width="274.85418701171875"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>当前边界<br/>入口目录不等于逐站采集接口<br/>每轮最多保留 3 条，公开资料覆盖有限<br/>打开或引文匹配不保证内容真实<br/>官方介绍不证明效果或付费意愿<br/>发现存浏览器，运行历史存本机<br/>自动研究依赖本地服务与 Codex</p></span></div></foreignObject></g></g></g></g></g></svg>