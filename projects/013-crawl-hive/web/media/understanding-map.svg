<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="map-title map-desc" xml:lang="zh-CN">
  <title id="map-title">从 CrawlHive 到个人 AI 信息工作台：能力、原理、思考、来源、扩展与价值总图</title>
  <desc id="map-desc">原库是面向币圈的私有信息监控应用。四类原生来源是经 Grok x_search 搜索的 X、读取 t.me/s 公开预览的 Telegram、比较 HTML 新增文本的公开网页，以及请求公开接口的 DexScreener。处理链为设定目标、周期调度与增量、分源采集、规则及可选 AI 提取、代币关联与去重风险检查、私有保存与交付、后续价格追踪。我们认为可迁移的是来源接入经验与持续处理流程，来源名单容易复制，钱包积分与行情评价强烈依赖领域，尚无独占数据或算法壁垒的证据，上游运行效果待验证。通用化应按方向、目的、来源和规则组织，增加普通身份、原始记录、事件证据、跨源关联和用户反馈。本仓库独立实现的知向原型于 2026 年 10 月 15 日实测四个公开来源：Hugging Face Blog、Google AI Blog、GitHub AI 与机器学习博客，以及 GitHub 公开仓库。支持真实快照、规则筛选、收藏和导出，没有模型与定时任务，静态页读快照，本地可按需刷新。候选来源还包括官方动态、Hugging Face 模型与 Spaces、arXiv、GitHub Releases、Hacker News、Product Hunt、中文媒体、YouTube、Reddit 与 X 官方 API。个人价值是减少逐站查找、控制关注范围、保留原文依据与研究线索；有用率、漏报重复、节省时间和费用仍需真实任务评价。图中分别标明原库源码确认、本仓库实测和候选规划。</desc>
